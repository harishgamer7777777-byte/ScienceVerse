
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScienceVerse | 3D Solar System</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030712;color:white;font-family:Arial,sans-serif;overflow:hidden}
header{position:absolute;top:0;left:0;width:100%;padding:20px 25px;z-index:2;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#030712dd,transparent)}
.logo{font-size:23px;color:#45d8ff;font-weight:bold}
header a{color:#b9d9ef;text-decoration:none}
#scene{width:100vw;height:100vh}
.panel{position:absolute;left:20px;top:100px;width:260px;background:#101c32dd;border:1px solid #24466b;border-radius:16px;padding:20px;z-index:2;backdrop-filter:blur(10px)}
.panel h2{color:#46d9ff;margin-top:0}
.panel p{color:#c4d3e7;line-height:1.5;font-size:14px}
.panel button{background:#123b5b;border:1px solid #36cfff;color:white;padding:10px;border-radius:8px;cursor:pointer;margin:3px}
#planetName{color:#45d8ff;font-size:21px}
.hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#b4c8e0;background:#101c32cc;padding:12px 20px;border-radius:20px;font-size:13px;white-space:nowrap}
@media(max-width:600px){.panel{top:85px;left:10px;width:210px;padding:12px}.logo{font-size:18px}.hint{font-size:11px}}
</style>
</head>
<body>
<header>
<div class="logo">🚀 ScienceVerse</div>
<a href="index.html">← Back to Home</a>
</header>

<div id="scene"></div>

<div class="panel">
<h2>🌌 Solar Explorer</h2>
<p>Explore our solar system in 3D. Select a planet to discover its secrets!</p>
<div id="planetName">The Sun ☀️</div>
<p id="planetInfo">The star at the center of our solar system. Its gravity keeps the planets in orbit.</p>
<div id="planetButtons"></div>
<button onclick="resetView()">Reset View</button>
</div>

<div class="hint">🖱️ Drag to rotate • Scroll to zoom • Click a planet to explore</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02040d);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,2000);
camera.position.set(0,35,65);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
document.getElementById("scene").appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.minDistance=5;
controls.maxDistance=180;

scene.add(new THREE.AmbientLight(0xffffff,0.4));

const sunLight=new THREE.PointLight(0xffffff,2000,500);
scene.add(sunLight);

const sun=new THREE.Mesh(
new THREE.SphereGeometry(3,48,48),
new THREE.MeshBasicMaterial({color:0xffb52e})
);
scene.add(sun);

const sunGlow=new THREE.Mesh(
new THREE.SphereGeometry(3.5,32,32),
new THREE.MeshBasicMaterial({color:0xff8c22,transparent:true,opacity:.13})
);
scene.add(sunGlow);

const starGeometry=new THREE.BufferGeometry();
const starPositions=[];
for(let i=0;i<3000;i++){
starPositions.push(
( Math.random()-.5)*700,
( Math.random()-.5)*500,
( Math.random()-.5)*700
);
}
starGeometry.setAttribute("position",new THREE.Float32BufferAttribute(starPositions,3));
const stars=new THREE.Points(starGeometry,new THREE.PointsMaterial({color:0xffffff,size:.45}));
scene.add(stars);

const planets=[
{name:"Mercury",radius:.45,distance:6,color:0xaaa9a6,speed:.018,info:"Mercury is the smallest planet and the closest planet to the Sun."},
{name:"Venus",radius:.75,distance:9,color:0xe8b56c,speed:.013,info:"Venus is the hottest planet in our solar system."},
{name:"Earth",radius:.82,distance:13,color:0x2588ff,speed:.01,info:"Earth is our home planet and the only world currently known to support life."},
{name:"Mars",radius:.62,distance:17,color:0xe35d37,speed:.008,info:"Mars is known as the Red Planet. Scientists study it for signs of ancient life."},
{name:"Jupiter",radius:2.1,distance:24,color:0xd9ae82,speed:.004,info:"Jupiter is the largest planet. It has a giant storm called the Great Red Spot."},
{name:"Saturn",radius:1.8,distance:32,color:0xe5cf9c,speed:.003,info:"Saturn is famous for its spectacular rings made mostly of ice and rocky particles."},
{name:"Uranus",radius:1.3,distance:40,color:0x7ddde2,speed:.002,info:"Uranus rotates on its side and has a very cold atmosphere."},
{name:"Neptune",radius:1.25,distance:48,color:0x355be9,speed:.0015,info:"Neptune is the farthest recognized planet from the Sun."}
];

const objects=[];
const clickable=[sun];

planets.forEach((p,index)=>{
const geometry=new THREE.SphereGeometry(p.radius,40,40);
const material=new THREE.MeshStandardMaterial({color:p.color,roughness:.8});
const mesh=new THREE.Mesh(geometry,material);
mesh.userData.planet=p;
scene.add(mesh);

const orbit=new THREE.Group();
scene.add(orbit);
orbit.add(mesh);
mesh.position.set(p.distance,0,0);

const ringGeometry=new THREE.BufferGeometry();
const points=[];
for(let i=0;i<=180;i++){
const a=i/180*Math.PI*2;
points.push(new THREE.Vector3(Math.cos(a)*p.distance,0,Math.sin(a)*p.distance));
}
ringGeometry.setFromPoints(points);
const ring=new THREE.LineLoop(ringGeometry,new THREE.LineBasicMaterial({color:0x416080,transparent:true,opacity:.35}));
scene.add(ring);

if(p.name==="Saturn"){
const ringMesh=new THREE.Mesh(
new THREE.RingGeometry(2.3,3.4,80),
new THREE.MeshBasicMaterial({color:0xdac69c,side:THREE.DoubleSide,transparent:true,opacity:.8})
);
ringMesh.rotation.x=Math.PI/2.5;
mesh.add(ringMesh);
}

objects.push({mesh,orbit,speed:p.speed,angle:index*.7});
clickable.push(mesh);

const button=document.createElement("button");
button.textContent=p.name;
button.onclick=()=>showPlanet(mesh);
document.getElementById("planetButtons").appendChild(button);
});

function showPlanet(mesh){
const p=mesh.userData.planet;
document.getElementById("planetName").textContent=p.name;
document.getElementById("planetInfo").textContent=p.info;
const target=new THREE.Vector3();
mesh.getWorldPosition(target);
controls.target.copy(target);
camera.position.copy(target.clone().add(new THREE.Vector3(0,5,12)));
}

function resetView(){
camera.position.set(0,35,65);
controls.target.set(0,0,0);
document.getElementById("planetName").textContent="The Sun ☀️";
document.getElementById("planetInfo").textContent="The star at the center of our solar system. Its gravity keeps the planets in orbit.";
}

window.resetView=resetView;

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener("click",event=>{
pointer.x=(event.clientX/innerWidth)*2-1;
pointer.y=-(event.clientY/innerHeight)*2+1;
raycaster.setFromCamera(pointer,camera);
const hits=raycaster.intersectObjects(clickable);
if(hits.length){
if(hits[0].object===sun){
document.getElementById("planetName").textContent="The Sun ☀️";
document.getElementById("planetInfo").textContent="The Sun is a star made mostly of hydrogen and helium. It provides light and heat to our solar system.";
controls.target.set(0,0,0);
}else showPlanet(hits[0].object);
}
});

function animate(){
requestAnimationFrame(animate);
objects.forEach(o=>{
o.angle+=o.speed;
o.orbit.rotation.y=o.angle;
o.mesh.rotation.y+=.008;
});
sun.rotation.y+=.002;
controls.update();
renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
